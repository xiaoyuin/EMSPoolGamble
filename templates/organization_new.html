<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1890ff">
    <title>创建组织</title>
    <style>
        * { box-sizing: border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.25rem; font-family:sans-serif; color:#262626; background:linear-gradient(145deg,#e6f7ff,#f0f2f5); }
        main { width:min(100%, 500px); padding:2rem; background:#fff; border-radius:16px; box-shadow:0 12px 36px rgba(24,144,255,.14); } h1 { margin:0 0 .5rem; color:#1890ff; } p { color:#595959; line-height:1.55; }
        label { display:block; margin-top:1rem; font-weight:600; } input { width:100%; margin-top:.4rem; padding:.72rem .8rem; border:1px solid #d9d9d9; border-radius:8px; font:inherit; } input:focus { outline:2px solid #91d5ff; border-color:#1890ff; }
        button { width:100%; margin-top:1.25rem; padding:.72rem; border:0; border-radius:8px; color:#fff; background:#1890ff; font:inherit; font-weight:600; cursor:pointer; } button:hover { background:#096dd9; } a { color:#1890ff; text-decoration:none; }.flash { padding:.65rem .8rem; border-radius:8px; background:#fffbe6; color:#874d00; }
    </style>
</head>
<body>
<main>
    <h1>创建组织</h1>
    <p>创建后会立即进入该组织，并成为它的组织管理员。</p>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="flash">{{ message }}</p>{% endfor %}{% endwith %}
    <form method="post" action="{{ url_for('new_organization') }}">
        <label>组织名称<input name="name" required maxlength="80" autocomplete="organization"></label>
        <label>管理员密码<input type="password" name="password" required minlength="12" maxlength="128" autocomplete="new-password"></label>
        <label>确认密码<input type="password" name="password_confirm" required minlength="12" maxlength="128" autocomplete="new-password"></label>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">创建并进入</button>
    </form>
    <p><a href="{{ url_for('organization_portal') }}">返回组织入口</a></p>
</main>
</body>
</html>
