<div class="organization-switcher{% if organization_switcher_flush %} organization-switcher--flush{% endif %}">
    <div class="organization-switcher-row{% if organization_page_title %} has-page-title{% endif %}">
        {% if organization_page_title %}<span class="organization-page-title">{{ organization_page_title }} -&nbsp;</span>{% endif %}
        <button type="button" class="organization-switcher-btn" data-organization-switcher-button
                aria-haspopup="menu" aria-expanded="false">
            <span>{{ g.organization['name'] }}</span>
            <svg class="organization-switcher-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </button>
    </div>
    <div class="organization-switcher-dropdown" data-organization-switcher-dropdown role="menu" hidden>
        <div class="organization-switcher-label">最近打开过</div>
        <div data-organization-switcher-list></div>
        <div class="organization-switcher-empty" data-organization-switcher-empty>暂无其他最近组织</div>
        <a class="organization-switcher-other" href="{{ url_for('organization_portal') }}" role="menuitem">进入其他组织…</a>
    </div>
</div>
